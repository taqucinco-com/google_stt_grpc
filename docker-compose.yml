services:
  grpc:
    build: ./grpc
    ports:
      - "50051:50051"
    volumes:
      - ./grpc:/usr/src/app
  hono:
    build: ./hono
    ports:
      - "8787:8787"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/usr/src/app/secrets/service-account.json
    volumes:
      - ./hono:/usr/src/app
      - /usr/src/app/node_modules
